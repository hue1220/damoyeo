<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>다모였니</title>
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-title" content="다모였니">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --bg:#ffffff; --soft:#f5f7fb; --line:#e6e9f0; --text:#1d2433; --sub:#6b7487;
  --brand:#2f6bff; --brand-soft:#eaf0ff; --ok:#16a36a; --ok-soft:#e7f7ef;
  --bad:#e5484d; --bad-soft:#fdecec; --warn:#f59e0b;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text)}
body{font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  -webkit-font-smoothing:antialiased;line-height:1.5;min-height:100vh}
#app{max-width:560px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:24px;font-weight:800;letter-spacing:-.02em}
h2{font-size:18px;font-weight:700;letter-spacing:-.01em;margin-bottom:10px}
p.sub{color:var(--sub);font-size:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:14px;
  padding:14px 18px;font:inherit;font-weight:700;font-size:16px;cursor:pointer;background:var(--brand);color:#fff;width:100%}
.btn:active{transform:scale(.98)}
.btn.ghost{background:var(--soft);color:var(--text)}
.btn.small{width:auto;padding:9px 14px;font-size:14px;border-radius:11px}
.btn.red{background:var(--bad-soft);color:var(--bad)}
.btn[disabled]{opacity:.45;cursor:default}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
label.f{display:block;font-size:13px;font-weight:600;color:var(--sub);margin:14px 0 6px}
input,textarea,select{width:100%;font:inherit;font-size:16px;border:1.5px solid var(--line);border-radius:12px;
  padding:12px 14px;background:#fff;color:var(--text);outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--brand)}
textarea{min-height:220px;resize:vertical;line-height:1.6}
.code-in{font-size:40px;font-weight:800;text-align:center;letter-spacing:.35em;padding:14px 0 14px .35em}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:17px}
.brand svg{width:30px;height:30px}
.link{background:none;border:0;color:var(--sub);font:inherit;font-size:13px;text-decoration:underline;cursor:pointer}
.hero{text-align:center;padding:18px 0 4px}
.hero svg{width:150px;height:auto;margin-bottom:8px}
.tabs{display:flex;background:var(--soft);border-radius:14px;padding:4px;margin-top:12px}
.tabs button{flex:1;border:0;background:none;font:inherit;font-weight:700;font-size:15px;padding:10px;border-radius:11px;color:var(--sub);cursor:pointer}
.tabs button.on{background:#fff;color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.big-count{font-size:52px;font-weight:800;letter-spacing:-.03em;line-height:1}
.big-count small{font-size:22px;color:var(--sub);font-weight:700}
.bar{height:10px;background:var(--soft);border-radius:10px;overflow:hidden;margin:14px 0 6px}
.bar i{display:block;height:100%;background:var(--ok);border-radius:10px;transition:width .4s}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;padding:5px 10px;border-radius:999px}
.pill.live{background:var(--ok-soft);color:var(--ok)}
.pill.end{background:var(--bad-soft);color:var(--bad)}
.codebox{font-size:30px;font-weight:800;letter-spacing:.2em;color:var(--brand)}
.list{display:grid;gap:8px;margin-top:10px}
.item{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-radius:12px;font-weight:600}
.item.miss{background:var(--bad-soft);color:#b3262b}
.item.here{background:var(--ok-soft);color:#0f7a4f}
.item .t{font-size:13px;font-weight:600;opacity:.85}
.no{display:inline-block;min-width:28px;color:inherit;opacity:.65;font-weight:700}
.names{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}
.names button{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:12px;font:inherit;font-size:15px;font-weight:600;text-align:left;cursor:pointer;color:var(--text)}
.names button .tag{display:block;font-size:11px;color:var(--sub);font-weight:500}
.msg{margin-top:12px;padding:12px 14px;border-radius:12px;font-size:14px;font-weight:600}
.msg.err{background:var(--bad-soft);color:#b3262b}
.msg.info{background:var(--brand-soft);color:#1f4fcc}
.check-card{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:22px 20px;border:2px solid var(--line);border-radius:20px;cursor:pointer;user-select:none;margin-top:14px}
.check-card .who{font-size:24px;font-weight:800}
.check-card .who .no{font-size:20px}
.box{width:52px;height:52px;border-radius:14px;border:3px solid #c6ccd8;display:grid;place-items:center;flex:none;transition:.2s}
.box svg{width:30px;height:30px;opacity:0;transition:.2s}
.check-card.done{border-color:var(--ok);background:var(--ok-soft);cursor:default}
.check-card.done .box{background:var(--ok);border-color:var(--ok)}
.check-card.done .box svg{opacity:1}
.demo{background:#fff8e6;color:#8a5a00;font-size:13px;font-weight:600;padding:9px 12px;border-radius:12px;margin-bottom:12px}
.qr{display:flex;justify-content:center;margin:12px 0}
.copy{display:flex;gap:8px}
.copy input{font-size:13px}
ol.guide{padding-left:20px;font-size:14px;color:var(--sub)}
ol.guide li{margin:4px 0}
.reg{font-size:12px;font-weight:700}
.reg.y{color:var(--ok)} .reg.n{color:var(--sub)}
.spacer{height:8px}
</style>
</head>
<body>
<div id="app"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
/* =========================================================
   ★ Firebase 설정 — 여기만 바꾸면 됩니다 ★
   Firebase 콘솔에서 복사한 값을 따옴표 안에 붙여넣으세요.
   비워두면 "체험 모드"(이 기기 안에서만 작동)로 열립니다.
   ========================================================= */
const firebaseConfig = {
  apiKey: "AIzaSyC6d1brhP6NEu_dTcnX-ZmE1164RyvjgH0",
  authDomain: "damoyeo-20ead.firebaseapp.com",
  databaseURL: "https://damoyeo-20ead-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "damoyeo-20ead",
  appId: "1:925195825023:web:b3ec69dd6894750f29744a"
};
/* ========================================================= */

const DEFAULT_MIN = 3;

/* ---------- 작은 도구들 ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone = v => v == null ? null : JSON.parse(JSON.stringify(v));
const LS = {
  get(k){ try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} },
  del(k){ try { localStorage.removeItem(k); } catch(e){} }
};
function hash(str){ // 간단한 해시(cyrb53)
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for (let i = 0; i < str.length; i++) { const ch = str.charCodeAt(i);
    h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677); }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(16);
}
function rid(n){
  const a = 'abcdefghjkmnpqrstuvwxyz23456789'; let s = '';
  for (const x of crypto.getRandomValues(new Uint32Array(n))) s += a[x % a.length];
  return s;
}
const sid = n => 's' + String(n).padStart(2,'0');
const hhmmss = t => new Date(t).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
const mmss = ms => { ms = Math.max(0, ms); const s = Math.ceil(ms/1000); return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0'); };
function deviceId(){ let d = LS.get('dm-device'); if(!d){ d = rid(12); LS.set('dm-device', d); } return d; }

/* ---------- 데이터 저장소 (Firebase 또는 체험 모드) ---------- */
let DB;
if (firebaseConfig.databaseURL && window.firebase) {
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  DB = {
    demo:false, offset:0,
    on(p, cb){ const r = db.ref(p); const h = s => cb(s.val()); r.on('value', h); return () => r.off('value', h); },
    get: p => db.ref(p).get().then(s => s.val()),
    set: (p, v) => db.ref(p).set(v),
    update: (p, o) => db.ref(p).update(o),
    remove: p => db.ref(p).remove()
  };
  db.ref('.info/serverTimeOffset').on('value', s => { DB.offset = s.val() || 0; });
} else {
  DB = makeDemoDB();
  if (firebaseConfig.databaseURL && !window.firebase) DB.loadError = true;
}
function makeDemoDB(){
  const KEY = 'damoyeo-demo';
  let tree = LS.get(KEY) || {};
  const subs = new Set();
  const parts = p => p.split('/').filter(Boolean);
  const getAt = p => parts(p).reduce((o,k) => o == null ? undefined : o[k], tree);
  function setAt(p, v){
    const ks = parts(p); let o = tree;
    for (let i = 0; i < ks.length - 1; i++) {
      if (typeof o[ks[i]] !== 'object' || o[ks[i]] === null) o[ks[i]] = {};
      o = o[ks[i]];
    }
    if (v === null || v === undefined) delete o[ks[ks.length-1]]; else o[ks[ks.length-1]] = clone(v);
  }
  const emit = () => subs.forEach(s => s.cb(clone(getAt(s.p) ?? null)));
  const save = () => { LS.set(KEY, tree); emit(); };
  addEventListener('storage', e => { if (e.key === KEY) { tree = LS.get(KEY) || {}; emit(); } });
  return {
    demo:true, offset:0,
    on(p, cb){ const s = {p, cb}; subs.add(s); cb(clone(getAt(p) ?? null)); return () => subs.delete(s); },
    get: async p => clone(getAt(p) ?? null),
    set: async (p, v) => { setAt(p, v); save(); },
    update: async (p, o) => { for (const k in o) setAt(p + '/' + k, o[k]); save(); },
    remove: async p => { setAt(p, null); save(); }
  };
}
const now = () => Date.now() + (DB.offset || 0);

/* ---------- 그림 ---------- */
const ICON = `<svg viewBox="0 0 40 40"><rect x="4" y="12" width="32" height="18" rx="5" fill="#2f6bff"/><rect x="8" y="15" width="7" height="6" rx="1.5" fill="#fff"/><rect x="17" y="15" width="7" height="6" rx="1.5" fill="#fff"/><rect x="26" y="15" width="6" height="6" rx="1.5" fill="#fff"/><circle cx="12" cy="31" r="3.2" fill="#1d2433"/><circle cx="28" cy="31" r="3.2" fill="#1d2433"/><path d="M20 3v9" stroke="#1d2433" stroke-width="1.6"/><path d="M20 3h8l-2 2.5 2 2.5h-8z" fill="#ffb020"/></svg>`;
const HERO = `<svg viewBox="0 0 200 120"><ellipse cx="100" cy="108" rx="80" ry="7" fill="#f0f3f9"/><rect x="40" y="46" width="120" height="50" rx="14" fill="#2f6bff"/><rect x="52" y="56" width="22" height="16" rx="4" fill="#fff"/><rect x="80" y="56" width="22" height="16" rx="4" fill="#fff"/><rect x="108" y="56" width="22" height="16" rx="4" fill="#fff"/><rect x="136" y="56" width="14" height="24" rx="3" fill="#cfe0ff"/><circle cx="68" cy="98" r="9" fill="#1d2433"/><circle cx="68" cy="98" r="3.5" fill="#fff"/><circle cx="134" cy="98" r="9" fill="#1d2433"/><circle cx="134" cy="98" r="3.5" fill="#fff"/><path d="M100 14v32" stroke="#1d2433" stroke-width="2.5"/><path d="M100 14h26l-6 7 6 7h-26z" fill="#ffb020"/><circle cx="30" cy="40" r="4" fill="#ffd27a"/><circle cx="172" cy="30" r="3" fill="#a9c2ff"/><circle cx="160" cy="18" r="2" fill="#ffb020"/></svg>`;
const CHECK = `<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>`;

/* ---------- 화면 그리기 (입력칸 포커스 유지) ---------- */
const app = $('#app');
function paint(html){
  const a = document.activeElement, id = a && a.id, pos = a && a.selectionStart;
  const banner = DB.loadError
    ? `<div class="demo" style="background:var(--bad-soft);color:#b3262b">인터넷 연결을 확인해 주세요. 저장소에 연결하지 못해 이 기기 안에서만 작동해요.</div>`
    : DB.demo ? `<div class="demo">체험 모드 · Firebase 연결 전이라 이 기기(브라우저) 안에서만 작동해요.</div>` : '';
  app.innerHTML = banner + html;
  if (id) { const el = document.getElementById(id); if (el) { el.focus(); try { el.setSelectionRange(pos,pos); } catch(e){} } }
}
const header = (right='') => `<div class="top"><div class="brand">${ICON}다모였니</div>${right}</div>`;

let unsubs = [], timers = [];
function reset(){ unsubs.forEach(f => f()); unsubs = []; timers.forEach(clearInterval); timers = []; }

/* ---------- 길 안내 ---------- */
function route(){
  reset();
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get('t')) return teacherGate(h.get('t'));
  if (h.get('c')) return studentStart(h.get('c'));
  const t = LS.get('dm-teacher'); if (t && t.cid) { location.hash = 't=' + t.cid; return; }
  const s = LS.get('dm-student'); if (s && s.cid) { location.hash = 'c=' + s.cid; return; }
  landing();
}
addEventListener('hashchange', route);

/* ================= 첫 화면 ================= */
function landing(){
  paint(`${header()}
  <div class="hero">${HERO}<h1>다 모였니?</h1><p class="sub">현장체험학습 인원 확인</p></div>
  <div class="card"><h2>학생이에요</h2><p class="sub">선생님이 보내준 링크(또는 QR코드)로 들어와 주세요.</p></div>
  <div class="card"><h2>선생님이에요</h2>
    <button class="btn" id="go-new">새 학급 만들기</button>
    <label class="f">이미 만든 학급이 있다면 — 학급 코드</label>
    <div class="row"><input id="old-cid" placeholder="학급 코드 10자리" autocomplete="off"><button class="btn ghost small" id="go-old" style="flex:none">열기</button></div>
  </div>`);
  $('#go-new').onclick = createClass;
  $('#go-old').onclick = () => { const v = $('#old-cid').value.trim(); if (v) location.hash = 't=' + v; };
}

/* ================= 교사: 학급 만들기 ================= */
function parseNames(text){
  return text.split('\n').map(s => s.replace(/^\s*\d+[\.\)\s]+/, '').trim()).filter(Boolean);
}
function rosterFrom(names){
  const r = {}; names.forEach((n,i) => r[sid(i+1)] = { no:i+1, name:n }); return r;
}
function createClass(){
  paint(`${header('<button class="link" id="back">처음으로</button>')}
  <h1 style="margin-top:10px">새 학급 만들기</h1>
  <p class="sub">한 번만 하면 돼요. 명단은 나중에 고칠 수 있어요.</p>
  <div class="card">
    <label class="f">학급 이름</label><input id="cname" placeholder="예) 2학년 3반">
    <label class="f">교사 비밀번호 (4자리 이상)</label><input id="cpw" type="password" placeholder="학생이 교사 화면을 못 열게 해요">
    <label class="f">학생 명단 — 출석번호 순서대로 한 줄에 한 명 (<b id="cnt">0</b>명)</label>
    <textarea id="cnames" placeholder="김민준&#10;이서연&#10;박도윤&#10;..."></textarea>
    <div id="err"></div>
    <div class="spacer"></div>
    <button class="btn" id="save">학급 만들기</button>
  </div>`);
  $('#back').onclick = () => { location.hash = ''; landing(); };
  $('#cnames').oninput = () => $('#cnt').textContent = parseNames($('#cnames').value).length;
  $('#save').onclick = async () => {
    const name = $('#cname').value.trim(), pw = $('#cpw').value, names = parseNames($('#cnames').value);
    const err = m => $('#err').innerHTML = `<div class="msg err">${m}</div>`;
    if (!name) return err('학급 이름을 적어주세요.');
    if (pw.length < 4) return err('비밀번호는 4자리 이상으로 해주세요.');
    if (!names.length) return err('학생 명단을 적어주세요.');
    const cid = rid(10), h = hash(cid + ':' + pw);
    $('#save').disabled = true;
    try {
      await DB.set('classes/' + cid, { name, teacherHash:h, roster:rosterFrom(names), createdAt:now() });
      LS.set('dm-teacher', { cid, h });
      location.hash = 't=' + cid + '&tab=share';
    } catch(e) { $('#save').disabled = false; err('저장하지 못했어요. 인터넷 연결이나 Firebase 설정을 확인해 주세요.'); }
  };
}

/* ================= 교사: 비밀번호 확인 ================= */
async function teacherGate(cid){
  paint(`${header()}<p class="sub" style="margin-top:20px">불러오는 중…</p>`);
  let data;
  try { data = await DB.get('classes/' + cid); } catch(e) { data = null; }
  if (!data) {
    paint(`${header()}<div class="msg err">학급을 찾을 수 없어요. 학급 코드를 확인해 주세요.</div><div class="spacer"></div><button class="btn ghost" id="home">처음으로</button>`);
    $('#home').onclick = () => { LS.del('dm-teacher'); location.hash = ''; landing(); };
    return;
  }
  const saved = LS.get('dm-teacher');
  if (saved && saved.cid === cid && saved.h === data.teacherHash) return teacherHome(cid);
  paint(`${header()}<div class="hero">${HERO}<h1>${esc(data.name)}</h1><p class="sub">교사 비밀번호를 입력하세요</p></div>
  <div class="card"><input id="pw" type="password" placeholder="비밀번호"><div id="err"></div><div class="spacer"></div><button class="btn" id="ok">들어가기</button></div>`);
  const go = () => {
    const h = hash(cid + ':' + $('#pw').value);
    if (h !== data.teacherHash) { $('#err').innerHTML = '<div class="msg err">비밀번호가 맞지 않아요.</div>'; return; }
    LS.set('dm-teacher', { cid, h }); teacherHome(cid);
  };
  $('#ok').onclick = go; $('#pw').onkeydown = e => { if (e.key === 'Enter') go(); };
}

/* ================= 교사: 메인 ================= */
function teacherHome(cid){
  reset();
  const params = new URLSearchParams(location.hash.slice(1));
  const T = { cid, data:null, tab: params.get('tab') === 'share' ? 'share' : 'check',
              code:'', min:DEFAULT_MIN, editing:false };
  unsubs.push(DB.on('classes/' + cid, d => { T.data = d; renderT(); }));
  timers.push(setInterval(() => tickT(T), 1000));

  function renderT(){
    const d = T.data; if (!d) return;
    const tabs = `<div class="tabs"><button data-tab="check" class="${T.tab==='check'?'on':''}">인원 확인</button><button data-tab="share" class="${T.tab==='share'?'on':''}">명단 · 학생 설치</button></div>`;
    paint(`${header(`<span class="sub" style="font-weight:700">${esc(d.name)}</span>`)}${tabs}<div id="tbody">${T.tab==='check' ? checkView() : shareView()}</div>`);
    document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => { T.tab = b.dataset.tab; T.editing = false; renderT(); });
    T.tab === 'check' ? bindCheck() : bindShare();
  }

  /* --- 인원 확인 탭 --- */
  function roster(){ const r = T.data.roster || {}; return Object.keys(r).sort().map(k => ({ k, ...r[k] })); }
  function checkView(){
    const s = T.data.session;
    if (!s || s.closed) {
      const last = s ? `<p class="sub" style="margin-top:10px">지난 확인: ${Object.keys(s.checks||{}).length} / ${roster().length}명 (${hhmmss(s.start)})</p>` : '';
      return `<div class="card"><h2>인원 확인 시작</h2>
        <p class="sub">학생들에게 알려줄 3자리 번호를 정하세요.</p>
        <div class="row" style="margin-top:12px"><input id="code" class="code-in" inputmode="numeric" maxlength="3" placeholder="000" value="${esc(T.code)}"></div>
        <div class="row" style="margin-top:10px"><button class="btn ghost small" id="rand">무작위 번호</button>
          <select id="min">${[2,3,5,10].map(m => `<option value="${m}" ${m==T.min?'selected':''}>${m}분 동안 유효</option>`).join('')}</select></div>
        <div id="err"></div><div class="spacer"></div>
        <button class="btn" id="start">시작하기</button>${last}</div>`;
    }
    const list = roster(), checks = s.checks || {};
    const miss = list.filter(x => !checks[x.k]), here = list.filter(x => checks[x.k]).sort((a,b) => checks[a.k] - checks[b.k]);
    const n = here.length, total = list.length, live = now() < s.expiresAt;
    return `<div class="card">
      <div class="top"><span id="status" class="pill ${live?'live':'end'}">${live ? '진행 중 · 남은 시간 ' + mmss(s.expiresAt - now()) : '시간 종료'}</span>
        <span class="sub">번호 <span class="codebox" style="font-size:22px">${esc(s.code)}</span></span></div>
      <div class="big-count" style="margin-top:12px">${n}<small> / ${total}명 도착</small></div>
      <div class="bar"><i style="width:${total ? n/total*100 : 0}%"></i></div>
      ${n === total && total ? '<div class="msg info">🎉 모두 도착했어요!</div>' : ''}
      <div class="row" style="margin-top:12px"><button class="btn ghost small" id="ext">+${T.min}분 연장</button><button class="btn red small" id="end">확인 끝내기</button></div>
    </div>
    ${miss.length ? `<div class="card"><h2>아직 체크 안 함 · ${miss.length}명</h2><div class="list">${miss.map(x => `<div class="item miss"><span><span class="no">${x.no}</span>${esc(x.name)}</span></div>`).join('')}</div></div>` : ''}
    ${here.length ? `<div class="card"><h2>도착 · ${here.length}명</h2><div class="list">${here.map(x => `<div class="item here"><span><span class="no">${x.no}</span>${esc(x.name)}</span><span class="t">${hhmmss(checks[x.k])}</span></div>`).join('')}</div></div>` : ''}`;
  }
  function bindCheck(){
    const s = T.data.session;
    if (!s || s.closed) {
      $('#code').oninput = e => { e.target.value = e.target.value.replace(/\D/g,'').slice(0,3); T.code = e.target.value; };
      $('#min').onchange = e => T.min = +e.target.value;
      $('#rand').onclick = () => { T.code = String(Math.floor(Math.random()*900)+100); $('#code').value = T.code; };
      $('#start').onclick = async () => {
        if (!/^\d{3}$/.test(T.code)) { $('#err').innerHTML = '<div class="msg err">숫자 3자리를 입력해 주세요.</div>'; return; }
        const t = now();
        await DB.set('classes/' + cid + '/session', { code:T.code, start:t, expiresAt:t + T.min*60000, closed:false });
        T.code = '';
      };
    } else {
      $('#ext').onclick = () => DB.update('classes/' + cid + '/session', { expiresAt: Math.max(now(), s.expiresAt) + T.min*60000 });
      $('#end').onclick = () => { if (confirm('이번 인원 확인을 끝낼까요?')) DB.update('classes/' + cid + '/session', { closed:true }); };
    }
  }
  function tickT(){
    const s = T.data && T.data.session, el = $('#status');
    if (!s || s.closed || !el || T.tab !== 'check') return;
    const live = now() < s.expiresAt;
    el.className = 'pill ' + (live ? 'live' : 'end');
    el.textContent = live ? '진행 중 · 남은 시간 ' + mmss(s.expiresAt - now()) : '시간 종료';
  }

  /* --- 명단 · 설치 탭 --- */
  function studentLink(){ return location.origin + location.pathname + '#c=' + cid; }
  function shareView(){
    const list = roster(), reg = T.data.reg || {};
    const regN = list.filter(x => reg[x.k]).length;
    if (T.editing) {
      return `<div class="card"><h2>명단 고치기</h2><p class="sub">출석번호 순서대로 한 줄에 한 명. 저장하면 이름 등록이 초기화돼요.</p>
        <textarea id="ed">${esc(list.map(x => x.name).join('\n'))}</textarea>
        <div class="row" style="margin-top:12px"><button class="btn ghost" id="cancel">취소</button><button class="btn" id="saveR">저장</button></div></div>`;
    }
    return `<div class="card"><h2>학생에게 보낼 링크</h2>
      <div class="copy"><input id="slink" readonly value="${esc(studentLink())}"><button class="btn small" id="copy" style="flex:none">복사</button></div>
      <div class="qr" id="qr"></div>
      <ol class="guide">
        <li>학생이 링크(또는 QR)를 <b>Safari / Chrome</b>에서 열기</li>
        <li>아이폰: 공유 → <b>홈 화면에 추가</b> / 안드로이드: ⋮ → <b>홈 화면에 추가</b></li>
        <li><b>홈 화면 아이콘으로 다시 열어서</b> 자기 이름 고르기 (중요!)</li>
      </ol></div>
    <div class="card"><div class="top"><h2 style="margin:0">명단 · 이름 등록 ${regN} / ${list.length}</h2><button class="btn ghost small" id="edit">명단 고치기</button></div>
      <div class="list">${list.map(x => `<div class="item" style="background:var(--soft)"><span><span class="no">${x.no}</span>${esc(x.name)}</span><span class="reg ${reg[x.k]?'y':'n'}">${reg[x.k] ? '등록됨' : '미등록'}</span></div>`).join('')}</div></div>
    <div class="card"><h2>다른 기기에서 교사 화면 열기</h2>
      <p class="sub">첫 화면 → 학급 코드 입력 → 비밀번호</p>
      <p class="codebox" style="font-size:22px;margin-top:6px">${esc(cid)}</p>
      <div class="spacer"></div><button class="link" id="logout">이 기기에서 교사 모드 나가기</button></div>`;
  }
  function bindShare(){
    if (T.editing) {
      $('#cancel').onclick = () => { T.editing = false; renderT(); };
      $('#saveR').onclick = async () => {
        const names = parseNames($('#ed').value); if (!names.length) return;
        T.editing = false;
        await DB.update('classes/' + cid, { roster:rosterFrom(names), reg:null });
      };
      return;
    }
    $('#copy').onclick = async () => {
      try { await navigator.clipboard.writeText(studentLink()); } catch(e) { $('#slink').select(); document.execCommand('copy'); }
      $('#copy').textContent = '복사됨!'; setTimeout(() => { const b = $('#copy'); if (b) b.textContent = '복사'; }, 1500);
    };
    if (window.QRCode) new QRCode($('#qr'), { text:studentLink(), width:170, height:170 });
    $('#edit').onclick = () => { T.editing = true; renderT(); };
    $('#logout').onclick = () => { if (confirm('이 기기에서 교사 모드를 나갈까요? (학급은 그대로 남아요)')) { LS.del('dm-teacher'); location.hash = ''; landing(); } };
  }
}

/* ================= 학생 ================= */
function studentStart(cid){
  reset();
  const S = { cid, data:null, view:null, msg:'', entered:null };
  const me = () => { const r = LS.get('dm-student'); return r && r.cid === cid && S.data && S.data.roster && S.data.roster[r.sid] ? r.sid : null; };
  paint(`${header()}<p class="sub" style="margin-top:20px">불러오는 중…</p>`);
  unsubs.push(DB.on('classes/' + cid, d => { S.data = d; renderS(); }));
  timers.push(setInterval(() => { if (S.view === 'card') renderS(); }, 5000));

  function renderS(){
    const d = S.data;
    if (!d) { paint(`${header()}<div class="msg err">학급을 찾을 수 없어요. 선생님께 링크를 다시 받아주세요.</div>`); return; }
    const k = me();
    if (!k) return pickView();
    const s = d.session;
    if (S.view === 'card' && (!s || s.closed || s.start !== S.entered)) { S.view = null; S.msg = '인원 확인이 새로 바뀌었어요. 선생님께 번호를 다시 받아주세요.'; }
    if (S.view === 'card' && !(s.checks && s.checks[k]) && now() > s.expiresAt) { S.view = null; S.msg = '시간이 지났어요. 선생님께 새 번호를 받아주세요.'; }
    S.view === 'card' ? cardView(k) : codeView(k);
  }

  function pickView(){
    const d = S.data, r = d.roster || {}, reg = d.reg || {}, my = deviceId();
    const list = Object.keys(r).sort().map(k => ({ k, ...r[k] }));
    paint(`${header()}<div class="hero">${HERO}<h1>${esc(d.name)}</h1><p class="sub">처음 한 번만! 내 이름을 골라주세요.</p></div>
      <div class="names">${list.map(x => `<button data-k="${x.k}"><span class="no">${x.no}</span>${esc(x.name)}${reg[x.k] && reg[x.k] !== my ? '<span class="tag">이미 등록됨</span>' : ''}</button>`).join('')}</div>`);
    document.querySelectorAll('.names button').forEach(b => b.onclick = async () => {
      const x = r[b.dataset.k], taken = reg[b.dataset.k] && reg[b.dataset.k] !== my;
      if (!confirm(`${x.no}번 ${x.name} 맞나요?` + (taken ? '\n\n※ 다른 폰에서 이미 고른 이름이에요. 본인이 맞을 때만 확인을 누르세요.' : ''))) return;
      LS.set('dm-student', { cid, sid:b.dataset.k });
      await DB.set('classes/' + cid + '/reg/' + b.dataset.k, my);
      renderS();
    });
  }

  function codeView(k){
    const x = S.data.roster[k];
    paint(`${header(`<span class="sub" style="font-weight:700">${x.no}번 ${esc(x.name)}</span>`)}
      <div class="hero">${HERO}<h1>번호를 입력하세요</h1><p class="sub">선생님이 알려준 3자리 번호</p></div>
      <div class="card"><input id="scode" class="code-in" inputmode="numeric" maxlength="3" placeholder="000" autocomplete="off">
        ${S.msg ? `<div class="msg err">${esc(S.msg)}</div>` : ''}
        <div class="spacer"></div><button class="btn" id="enter">들어가기</button></div>
      <div style="text-align:center;margin-top:18px"><button class="link" id="repick">내 이름이 아니에요</button></div>`);
    $('#scode').oninput = e => e.target.value = e.target.value.replace(/\D/g,'').slice(0,3);
    const go = () => {
      const v = $('#scode').value, s = S.data.session;
      if (!s || s.closed) S.msg = '지금은 진행 중인 인원 확인이 없어요.';
      else if (v !== s.code) S.msg = '번호가 달라요. 다시 확인해 주세요.';
      else if (now() > s.expiresAt) S.msg = '시간이 지났어요. 선생님께 새 번호를 받아주세요.';
      else { S.msg = ''; S.view = 'card'; S.entered = s.start; }
      renderS();
    };
    $('#enter').onclick = go; $('#scode').onkeydown = e => { if (e.key === 'Enter') go(); };
    $('#repick').onclick = () => { if (confirm('이름을 다시 고를까요?')) { LS.del('dm-student'); renderS(); } };
  }

  function cardView(k){
    const x = S.data.roster[k], s = S.data.session, t = s.checks && s.checks[k];
    paint(`${header()}
      <div class="hero">${HERO}<h1>${t ? '확인 완료!' : '여기 있어요?'}</h1><p class="sub">${t ? hhmmss(t) + ' 에 체크했어요. 선생님 화면에 표시됐어요.' : '내 이름 옆 상자를 눌러 체크하세요.'}</p></div>
      <div class="check-card ${t?'done':''}" id="cc"><div class="who"><span class="no">${x.no}</span>${esc(x.name)}</div><div class="box">${CHECK}</div></div>
      ${t ? '' : `<p class="sub" style="text-align:center;margin-top:12px">남은 시간 ${mmss(s.expiresAt - now())}</p>`}`);
    if (!t) $('#cc').onclick = async () => {
      const cur = S.data.session;
      if (!cur || cur.closed || cur.start !== S.entered || now() > cur.expiresAt) { renderS(); return; }
      await DB.set('classes/' + cid + '/session/checks/' + k, now());
      if (navigator.vibrate) navigator.vibrate(60);
    };
  }
}

route();
</script>
</body>
</html>
